name: smart_residence
description: Smart Building Management System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  mobile_scanner: ^3.4.1  # Alternative plus récente
  vibration: ^1.8.4  # Pour feedback haptique
  flutter_animate: ^4.5.0  # Pour animations
  http: ^1.2.0
  shared_preferences: ^2.2.0
  provider: ^6.1.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  # IMPORTANT: L'INDENTATION EST CRUCIALE!
  # Les tirets doivent être alignés avec 'assets:'
  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/images/building.png